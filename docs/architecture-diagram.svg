<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr"       markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,8 2.5,0 5" fill="#7A8499"/></marker>
    <marker id="arr-pass"  markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,8 2.5,0 5" fill="#3DB87A"/></marker>
    <marker id="arr-fail"  markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,8 2.5,0 5" fill="#D4654F"/></marker>
    <marker id="arr-teal"  markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,8 2.5,0 5" fill="#4FB8AE"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,8 2.5,0 5" fill="#E8A33D"/></marker>
    <marker id="arr-blue"  markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,8 2.5,0 5" fill="#5A7FBF"/></marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#13161C" rx="8"/>

  <!-- Section divider -->
  <line x1="450" y1="14" x2="450" y2="466" stroke="#2A2F3A" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ══════════════════ LEFT: ORCHESTRATION LOOP ══════════════════ -->

  <text x="24" y="27" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="700"
        letter-spacing="0.1em" fill="#7A8499">ORCHESTRATION LOOP</text>

  <!-- PROBLEM INPUT -->
  <rect x="65" y="38" width="160" height="32" rx="4" fill="none" stroke="#2A2F3A" stroke-width="1.5"/>
  <text x="145" y="58" font-family="'IBM Plex Mono',monospace" font-size="11"
        fill="#7A8499" text-anchor="middle">PROBLEM INPUT</text>

  <!-- Problem → Planner -->
  <line x1="145" y1="70" x2="145" y2="94" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PLANNER -->
  <rect x="65" y="94" width="160" height="44" rx="6" fill="rgba(232,163,61,.10)" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="145" y="112" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#E8A33D" text-anchor="middle">PLANNER</text>
  <text x="145" y="128" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(232,163,61,.6)" text-anchor="middle">qwen-turbo · structured plan</text>

  <!-- Planner → Coder -->
  <line x1="145" y1="138" x2="145" y2="162" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CODER -->
  <rect x="65" y="162" width="160" height="44" rx="6" fill="rgba(79,184,174,.10)" stroke="#4FB8AE" stroke-width="1.5"/>
  <text x="145" y="180" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#4FB8AE" text-anchor="middle">CODER</text>
  <text x="145" y="196" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(79,184,174,.6)" text-anchor="middle">qwen-max · code only</text>

  <!-- Coder → Verifier -->
  <line x1="145" y1="206" x2="145" y2="232" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- VERIFIER -->
  <rect x="65" y="232" width="160" height="44" rx="6" fill="rgba(139,127,212,.10)" stroke="#8B7FD4" stroke-width="1.5"/>
  <text x="145" y="250" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#8B7FD4" text-anchor="middle">VERIFIER</text>
  <text x="145" y="266" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(139,127,212,.6)" text-anchor="middle">deterministic · FC sandbox</text>

  <!-- Verifier → Solved (pass) -->
  <line x1="145" y1="276" x2="145" y2="312" stroke="#3DB87A" stroke-width="1.5" marker-end="url(#arr-pass)"/>
  <text x="106" y="298" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#3DB87A">pass</text>

  <!-- SOLVED -->
  <rect x="65" y="312" width="160" height="34" rx="4" fill="rgba(61,184,122,.15)" stroke="#3DB87A" stroke-width="1.5"/>
  <text x="145" y="334" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#3DB87A" text-anchor="middle">SOLVED ✓</text>

  <!-- Verifier → Critic (fail) -->
  <line x1="225" y1="254" x2="271" y2="254" stroke="#D4654F" stroke-width="1.5" marker-end="url(#arr-fail)"/>
  <text x="233" y="248" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#D4654F">fail</text>

  <!-- CRITIC -->
  <rect x="271" y="232" width="152" height="44" rx="6" fill="rgba(212,101,79,.10)" stroke="#D4654F" stroke-width="1.5"/>
  <text x="347" y="250" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#D4654F" text-anchor="middle">CRITIC</text>
  <text x="347" y="266" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(212,101,79,.6)" text-anchor="middle">qwen-plus · patch|replan|quit</text>

  <!-- Critic → Coder (patch): curved left-up -->
  <path d="M 271,249 C 246,249 246,184 225,184" fill="none"
        stroke="#4FB8AE" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-teal)"/>
  <text x="248" y="222" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(79,184,174,.85)" text-anchor="middle">patch</text>

  <!-- Critic → Planner (replan): curved further left-up -->
  <path d="M 271,242 C 242,242 238,116 225,116" fill="none"
        stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>
  <text x="246" y="180" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(232,163,61,.85)" text-anchor="middle">replan</text>

  <!-- Critic → Unsolved (give_up) -->
  <line x1="347" y1="276" x2="347" y2="312" stroke="#D4654F" stroke-width="1.5" marker-end="url(#arr-fail)"/>
  <text x="350" y="298" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(212,101,79,.8)">give_up</text>

  <!-- UNSOLVED -->
  <rect x="267" y="312" width="160" height="34" rx="4" fill="rgba(212,101,79,.10)" stroke="#D4654F" stroke-width="1"/>
  <text x="347" y="334" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#D4654F" text-anchor="middle">UNSOLVED ✕</text>

  <!-- Cap enforcement note -->
  <text x="24" y="382" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#5A6478">max 4 coder attempts · max 2 replans</text>
  <text x="24" y="396" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#5A6478">caps enforced in code, not in prompts</text>

  <!-- ══════════════════ RIGHT: DEPLOYMENT ARCHITECTURE ══════════════════ -->

  <text x="466" y="27" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="700"
        letter-spacing="0.1em" fill="#7A8499">DEPLOYMENT ARCHITECTURE</text>

  <!-- FRONTEND -->
  <rect x="548" y="36" width="242" height="50" rx="6" fill="rgba(90,127,191,.08)" stroke="#5A7FBF" stroke-width="1.5"/>
  <text x="669" y="55" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#5A7FBF" text-anchor="middle">FRONTEND</text>
  <text x="669" y="71" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(90,127,191,.65)" text-anchor="middle">HTML · CSS · JS · Chart.js</text>

  <!-- Frontend ↔ Backend -->
  <line x1="669" y1="86" x2="669" y2="118" stroke="#5A7FBF" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="673" y="106" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(90,127,191,.7)">WebSocket · REST</text>

  <!-- BACKEND / ECS -->
  <rect x="548" y="118" width="242" height="56" rx="6" fill="rgba(255,255,255,.03)" stroke="#2A2F3A" stroke-width="1.5"/>
  <text x="669" y="137" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700"
        fill="#E7E5DE" text-anchor="middle">BACKEND — FastAPI</text>
  <text x="669" y="153" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="#7A8499" text-anchor="middle">Alibaba Cloud ECS · uvicorn</text>
  <text x="669" y="167" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="#7A8499" text-anchor="middle">Orchestrator · Agents · Benchmark</text>

  <!-- Backend → Qwen Cloud -->
  <path d="M 625,174 L 582,232" fill="none" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="583" y="212" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="#5A6478" text-anchor="middle">LLM calls</text>

  <!-- Backend → FC Sandbox -->
  <path d="M 713,174 L 756,232" fill="none" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="759" y="212" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="#5A6478" text-anchor="middle">code exec</text>

  <!-- QWEN CLOUD -->
  <rect x="462" y="232" width="212" height="116" rx="6" fill="rgba(232,163,61,.06)" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="568" y="252" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700"
        fill="#E8A33D" text-anchor="middle">QWEN CLOUD</text>

  <rect x="476" y="260" width="184" height="22" rx="3" fill="rgba(79,184,174,.15)" stroke="rgba(79,184,174,.4)" stroke-width="1"/>
  <text x="486" y="275" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#4FB8AE">qwen-max</text>
  <text x="600" y="275" font-family="'IBM Plex Mono',monospace" font-size="8" fill="rgba(79,184,174,.6)">Coder</text>

  <rect x="476" y="288" width="184" height="22" rx="3" fill="rgba(212,101,79,.12)" stroke="rgba(212,101,79,.4)" stroke-width="1"/>
  <text x="486" y="303" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#D4654F">qwen-plus</text>
  <text x="600" y="303" font-family="'IBM Plex Mono',monospace" font-size="8" fill="rgba(212,101,79,.6)">Critic · Baseline</text>

  <rect x="476" y="316" width="184" height="22" rx="3" fill="rgba(232,163,61,.12)" stroke="rgba(232,163,61,.4)" stroke-width="1"/>
  <text x="486" y="331" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#E8A33D">qwen-turbo</text>
  <text x="600" y="331" font-family="'IBM Plex Mono',monospace" font-size="8" fill="rgba(232,163,61,.6)">Planner · Summarizer</text>

  <!-- FUNCTION COMPUTE -->
  <rect x="694" y="232" width="172" height="116" rx="6" fill="rgba(139,127,212,.06)" stroke="#8B7FD4" stroke-width="1.5"/>
  <text x="780" y="252" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700"
        fill="#8B7FD4" text-anchor="middle">FUNCTION COMPUTE</text>
  <text x="780" y="269" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(139,127,212,.7)" text-anchor="middle">ephemeral container</text>
  <text x="780" y="284" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(139,127,212,.7)" text-anchor="middle">per-invocation teardown</text>
  <text x="780" y="299" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(139,127,212,.7)" text-anchor="middle">8 s timeout · 256 MB</text>
  <text x="780" y="314" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="rgba(139,127,212,.7)" text-anchor="middle">no network access</text>
  <text x="780" y="335" font-family="'IBM Plex Mono',monospace" font-size="8"
        fill="rgba(139,127,212,.5)" text-anchor="middle">ap-southeast-1</text>

  <!-- SINGLE-AGENT BASELINE comparison box -->
  <rect x="462" y="366" width="404" height="48" rx="6" fill="rgba(255,255,255,.02)" stroke="#2A2F3A" stroke-width="1"/>
  <text x="664" y="385" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="700"
        fill="#7A8499" text-anchor="middle">SINGLE-AGENT BASELINE</text>
  <text x="664" y="402" font-family="'IBM Plex Mono',monospace" font-size="9"
        fill="#5A6478" text-anchor="middle">qwen-plus · same sandbox · same 4-attempt cap · no role split</text>

  <!-- Bottom branding -->
  <text x="450" y="452" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700"
        fill="#4FB8AE" text-anchor="middle" letter-spacing="0.1em">QUORUM</text>
  <text x="450" y="469" font-family="'IBM Plex Mono',monospace" font-size="8"
        fill="#5A6478" text-anchor="middle">Qwen Cloud Global AI Hackathon · Track 3: Agent Society</text>
</svg>
